<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T &amp; S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="gallery.css">
</head>
<body>

  <header class="hero">
    <img class="hero-mark" src="logo.jpeg" alt="T and S monogram">
    <h1 class="hero-names foil">Thabile <span class="amp">&amp;</span> Suri</h1>
    <p class="hero-sub">a few of our favorite moments</p>
    <div class="hero-scroll">
      <div class="line"></div>
      <span>Scroll</span>
    </div>
  </header>

  <section id="gallery">
    <div class="divider"><div class="rule"></div><div class="heart"></div><div class="rule right"></div></div>
    <p class="section-kicker">Our Story</p>
    <h2 class="section-title">In Pictures</h2>

    <div class="gallery" id="galleryGrid">
      <!-- Each .frame is one photo slot. Replace the src in the <img> tag with your own photo
           (e.g. src="photo1.jpg") and it will automatically replace this placeholder. -->

      <figure class="frame">
        <div class="frame-inner">
          <img src="WhatsApp Image 2026-08-07 at 14.19.41.jpeg" alt="Photo 1" onerror="this.style.display='none'">
          <div class="placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg>
          </div>
          <div class="frame-gold-border"></div>
          <div class="corner tl"></div><div class="corner br"></div>
          <div class="frame-caption"><div class="num">01</div><div class="cap">Krispy Kreme employees</div></div>
        </div>
      </figure>

      <figure class="frame">
        <div class="frame-inner">
          <img src="WhatsApp Image 2026-08-07 at 14.19.47.jpeg" alt="Photo 2" onerror="this.style.display='none'">
          <div class="placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg>
          </div>
          <div class="frame-gold-border"></div>
          <div class="corner tl"></div><div class="corner br"></div>
          <div class="frame-caption"><div class="num">02</div><div class="cap">Golden hour</div></div>
        </div>
      </figure>

      <figure class="frame">
        <div class="frame-inner">
          <img src="WhatsApp Image 2026-08-07 at 14.19.49.jpeg" alt="Photo 3" onerror="this.style.display='none'">
          <div class="placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg>
          </div>
          <div class="frame-gold-border"></div>
          <div class="corner tl"></div><div class="corner br"></div>
          <div class="frame-caption"><div class="num">03</div><div class="cap">Just us</div></div>
        </div>
      </figure>

      <figure class="frame">
        <div class="frame-inner">
          <img src="WhatsApp Image 2026-08-07 at 14.25.54.jpeg" alt="Photo 4" onerror="this.style.display='none'">
          <div class="placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg>
          </div>
          <div class="frame-gold-border"></div>
          <div class="corner tl"></div><div class="corner br"></div>
          <div class="frame-caption"><div class="num">04</div><div class="cap">A perfect day</div></div>
        </div>
      </figure>

      <figure class="frame">
        <div class="frame-inner">
          <img src="showroom.jpeg" alt="Photo 5" onerror="this.style.display='none'">
          <div class="placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg>

          <div class="corner tl"></div><div class="corner br"></div>

        </div>

      <figure class="frame">
        <div class="frame-inner">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg>

          <div class="frame-caption"><div class="num">06</div><div class="cap">Still us</div></div>
        </div>
      </figure>
    </div>

    <div class="closing">
      <p>&ldquo;Every photograph is small proof that we chose each other again.&rdquo;</p>
    </div>
    <div class="audio-player">
            <button id="playBtn" class="play-btn">▶</button>
            <div class="track-info">Die with a smile</div>
            <audio id="bgAudio" controls>
                <source src="Die with a smile.mp3" type="audio/mpeg"
            </audio>
    </div>
  </section>

  <footer>Made with love &middot; T &amp; S</footer>

<script>
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if(e.isIntersecting){
        e.target.classList.add('in-view');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.15 });

  document.querySelectorAll('.frame, .closing p').forEach((el, i) => {
    el.style.transitionDelay = (i % 6) * 90 + 'ms';
    io.observe(el);
  });
</script>

</body>
</html>
