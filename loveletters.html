<body>

  <header class="lib-hero">

  <main class="shelf" id="shelf">
    <!-- Each .envelope is one letter. Edit data-title / data-date / data-body,
         or duplicate the whole <div class="envelope"> block to add more letters. -->

    <div class="envelope" data-title="Venting session" data-date="March 2026"
         data-body="You’re the most beautiful  woman I’ve ever laid my eyes on. The warmth of your smile, the glisten in your eyes, the subtlety in your beautiful. Once I saw all these things for the first time…I knew that I could never live without them ever again. I’ve never believed in soulmates but Out of 8 billion human beings God saw it fit for me and you to be together. I’m eternally grateful. I see a future. A future I’ve always pondered about. The feeling I get when your hand brushes against mine. When I’m the reason you smile. Nothing can describe it. You’ve given me the most beautiful moments of my life. The moments I’ll cherish forever. When we went to woodlands for ice cream. When we went to woodlands again for Starbucks. When we went to total ninja. When I sang for you by the tire. When we had our first kiss. When we took walks around magalies. When we used to go out for ice cream. When I first spoke to you and we went back and forth about skopo. When we saw that granny almost fall on our way to the park. When we got caught by your brother. And so many more baby. My prayer to God that may we be joint at the hip. May we never leave each others sides. May the only thing that separates us be death. Until then…I want to live my life with you and no one else but you. I never imagined you’d be this important to me but here we are. I love you so much baby. I dont know what I did to deserve you, your kindness, your care, your compassion and just so much more. You’re the light of my life.

Yours, always,
Tellythabi.">
      <div class="wax-seal"><span>TS</span></div>
      <div class="env-face">
        <p class="env-to">For Suri</p>

      </div>
    </div>

    <div class="envelope" data-title="My version of a sonnet" data-date="July 2023"
         data-body="I genuinely think I’m a very lucky person. I have stumbled upon the most beautiful human being ever. Even better than I could imagine. I am beyond grateful for what we have together, I am grateful for everything we have managed to build for the past year and a half. I never imagined myself in this position. You have loved me in way I never thought possible. You have cared for me in more ways than one. I don’t know what I’d do without you, I don’t even wanna imagine. You are my best friend and My biggest cheerleader . You celebrate every milestone with me. When I feel down and out you are there as well. I’ve never felt anything as warm as your love, as tender as your love. I thank God I met a person as amazing as you are. You’re literally the best thing that’s ever happened to me. Your smile, your love, your hand on mine, your hugs, your kisses, your scent, your humour, your care and virtually everything else about you are all the things that I wake up motivated in the morning. It’s also the reason I don’t give up when I want to. I keep going because of you. My soul and basically my very being is deeply intertwined with yours. You are my everything. And I also want you to know that each and every moment we have together, every moment we spent laughing together, everytime we spent and just for a moment it felt like time slowed down, all of those moments are all etched deep into my mind,I love u more than u know, more than anything. I didn’t know it was possible to feel this way about someone but it is. I’m so glad that it’s you
Tellythabi.">
      <div class="wax-seal"><span>TS</span></div>
      <div class="env-face">
        <p class="env-to">For Suri</p>
        <p class="env-date">July 2025</p>
      </div>
    </div>

    <div class="envelope" data-title="I appreciate HER" data-date="November 2023"
         data-body="Babe I just wanted to tell u how amazing I think you are. You are such a beautiful human being. I could’ve never imagined I’d end up with a person like you. You’re so loving, caring, kind and honestly so much more. I remember when we started dating i literally thought u were perfect. No flaws!! U always looked beautiful…not a strand of hair out of place. Your smile was always vibrant and always lights up my world. Then we went a few months down the line and I realised you’re not perfect but I love you anyway. Even on your bad days you tell me you love me. Even on your bad days you call to check up on me. Even when u cry you tell me you love me. Even when you’re upset you want me to be happy, because of that I will always think you are perfect. You are the best gift God has ever given to me. I pray for you constantly. For our relationship. I pray we get closer to God as well. I wake up everyday highly motivated to be better for u. To be the best, for you. It’s always been for u. Coz I wanna give u every good thing this world has to offer. I’m really proud of the person you’re becoming, motivated and focused. It looks good. I have a million words to say but I don’t have the time to say them so I’ll show you in each and every action, everytime I am with you. I am crazy about u and nothing will ever change that babe, I love u
Forever,
Tellythabi.">
      <div class="wax-seal"><span>TS</span></div>
      <div class="env-face">
        <p class="env-to">For Suri</p>
        <p class="env-date">November 2024</p>
      </div>
    </div>

    <div class="envelope" data-title="SHE SAID YES!!!" data-date="November 2024"
         data-body="Suri…I’m just gonna say what I wanted to say. I’ve been thinking lately, a lot. About myself, about you and just who u are as a person and about our future. I’ll always find it crazy how we were brought together but I’m glad it happened. No word can express how much I love u but I’m gonna try anyway as the days progress I realise that I want to spend forever with u, however long forever may be…may it be with you. Everyday I think about how I want to be the best version of myself but for the people I love…u included. I’ve had two amazing months with you and I honestly don’t know how I ever lived without you. I love you. I want you to be mine. I cannot picture this life thing without you and I wanna have all my happy moments with you by my side. When I’m happy I’d like u to be there. When I’m sad I’d like u to be there. When you’re happy I want u to allow me to be there and when you’re sad I want u to allow me to be there.

I found this verse in the bible and it goes like this 

In Ruth 1:16-17 New International Version (NIV) it says
Where you go I will go, and where you stay I will stay. Your people will be my people and your God my God. Where you die I will die, and there I will be buried. May the LORD deal with me, be it ever so severely, if even death separates you and me.

This is my promise to u.

With that being said…what do u say? 
Do u OFFICIALLY want to be my girlfriend?

Yours,
Tellythabi.">
      <div class="wax-seal"><span>TS</span></div>
      <div class="env-face">
        <p class="env-to">For Sienna</p>
        <p class="env-date">February 2024</p>
      </div>
    </div>
  </main>

  <div class="reader" id="reader">
    <div class="reader-backdrop" id="readerBackdrop"></div>
    <div class="letter-paper" id="letterPaper">
      <button class="close-btn" id="closeBtn" aria-label="Close letter">&times;</button>
      <p class="letter-date" id="letterDate"></p>
      <h2 class="letter-title" id="letterTitle"></h2>
      <p class="letter-body" id="letterBody"></p>
      <div class="letter-sign">T &amp; S</div>
    </div>
  </div>

  <footer>Made with love &middot; T &amp; S</footer>

<script>
  const shelf = document.getElementById('shelf');
  const reader = document.getElementById('reader');
  const paper = document.getElementById('letterPaper');
  const backdrop = document.getElementById('readerBackdrop');
  const closeBtn = document.getElementById('closeBtn');

  shelf.querySelectorAll('.envelope').forEach(env => {
    env.addEventListener('click', () => {
      document.getElementById('letterTitle').textContent = env.dataset.title;
      document.getElementById('letterDate').textContent = env.dataset.date;
      document.getElementById('letterBody').textContent = env.dataset.body;
      reader.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
  });

  function closeReader(){
    reader.classList.remove('open');
    document.body.style.overflow = '';
  }
  closeBtn.addEventListener('click', closeReader);
  backdrop.addEventListener('click', closeReader);
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeReader(); });

  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if(e.isIntersecting){ e.target.classList.add('in-view'); io.unobserve(e.target); }
    });
  }, { threshold: 0.2 });
  shelf.querySelectorAll('.envelope').forEach((el, i) => {
    el.style.transitionDelay = (i % 4) * 100 + 'ms';
    io.observe(el);
  });
</script>

</body>
</html>
