<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Songs &middot; T &amp; S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="memories.css">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
</head>
<body>

  <header class="pl-hero">
    <img class="pl-mark" src="logo.jpeg" alt="T and S monogram">
    <p class="pl-kicker">A Little Something To Play</p>
    <h1 class="pl-title foil">Our Songs</h1>
    <p class="pl-sub">the ones that sound like us</p>
    <div class="divider"><div class="rule"></div><div class="heart"></div><div class="rule right"></div></div>
  </header>

  <main class="pl-main">
    <div class="pl-frame">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>

      <!-- Replace the src below with your playlist link, changing
           "music.apple.com" to "embed.music.apple.com" -->
      <iframe
        class="pl-embed"
        allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write"
        frameborder="0"
        height="450"
        sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation"
        src="https://embed.music.apple.com/za/playlist/pl.u-WabZ687fegz33g7">
      </iframe>
    </div>



    <div class="notes">
      <!-- Optional: a few lines about specific songs. Duplicate .note to add more, or delete this block entirely. -->
      <div class="note">
        <p class="note-title">[Song Title]</p>
        <p class="note-text">[Why this one made the list — where you were, what it reminds you of.]</p>
      </div>
      <div class="note">
        <p class="note-title">[Song Title]</p>
        <p class="note-text">[A line about this one too.]</p>
      </div>
    </div>
  </main>

  <footer>Made with love &middot; T &amp; S</footer>

</body>
</html>
